<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  
  <!-- Globe Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="white" stroke-width="4" opacity="0.3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
  
  <!-- Letter N -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="240" font-weight="bold" fill="white" text-anchor="middle">N</text>
  
  <!-- Scan line effect -->
  <rect x="0" y="240" width="512" height="2" fill="white" opacity="0.2"/>
</svg>
